<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<title>NetLearn - Kartu Marker AR</title>
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; }
  .card { width: 20cm; margin: 1cm auto; text-align: center; page-break-after: always; }
  .target { width: 20cm; height: 20cm; }
  .label { margin-top: 0.4cm; }
  .label .obj { font-size: 22pt; font-weight: 700; }
  .label .mod { font-size: 12pt; color: #555; letter-spacing: 1px; text-transform: uppercase; }
  @media print { @page { size: A4; margin: 1cm; } .card { margin: 0 auto; } }
</style></head><body>
  <div class="card">
    <img class="target" src="markers/marker_01_komputer.png" alt="Komputer Desktop">
    <div class="label"><div class="obj">Komputer Desktop</div><div class="mod">Modul 1</div></div>
  </div>
  <div class="card">
    <img class="target" src="markers/marker_02_switch.png" alt="Switch">
    <div class="label"><div class="obj">Switch</div><div class="mod">Modul 2</div></div>
  </div>
  <div class="card">
    <img class="target" src="markers/marker_03_hub.png" alt="Hub">
    <div class="label"><div class="obj">Hub</div><div class="mod">Modul 2</div></div>
  </div>
  <div class="card">
    <img class="target" src="markers/marker_04_router.png" alt="Router">
    <div class="label"><div class="obj">Router</div><div class="mod">Modul 2</div></div>
  </div>
  <div class="card">
    <img class="target" src="markers/marker_05_topologi.png" alt="Topologi Star">
    <div class="label"><div class="obj">Topologi Star</div><div class="mod">Modul 3</div></div>
  </div>
  <div class="card">
    <img class="target" src="markers/marker_06_ipaddress.png" alt="Simulasi IP Address">
    <div class="label"><div class="obj">Simulasi IP Address</div><div class="mod">Modul 4</div></div>
  </div>
</body></html>
