name: netlearn
description: "NetLearn — Aplikasi Pembelajaran AR Jaringan Komputer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  youtube_player_iframe: ^6.0.2
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  ar_flutter_plugin_plus: ^1.1.3
  file_picker: ^13.1.0
  url_launcher: ^6.3.3
  pdfx: ^2.6.0
  http: ^1.3.0
  path_provider: ^2.1.6
  open_filex: ^4.4.0
  permission_handler: ^12.0.0
  audioplayers: ^6.8.1
  google_generative_ai: ^0.4.7
  speech_to_text: ^7.5.0
  pdf: ^3.13.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/audio/sfx/
    - assets/downloads/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/figma/DMSans-Variable.ttf
        - asset: assets/fonts/figma/DMSans-Italic-Variable.ttf
          style: italic

    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/figma/PlusJakartaSans-Variable.ttf
        - asset: assets/fonts/figma/PlusJakartaSans-Italic-Variable.ttf
          style: italic

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-ExtraBold.ttf
          weight: 800

